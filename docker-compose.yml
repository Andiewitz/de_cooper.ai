services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decooper
      POSTGRES_USER: decooper
      POSTGRES_PASSWORD: decooper_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decooper -d decooper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
